name: App Store screenshots
on:
  push:
    branches: [fideora-appstore-assets]
    paths: [".github/workflows/appstore-screenshots.yml"]
  workflow_dispatch:
    inputs:
      device:
        description: Devices to capture
        type: choice
        default: both
        options: [both, iphone, ipad]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.device == 'both' && '["iphone","ipad"]' || inputs.device == 'iphone' && '["iphone"]' || '["ipad"]') }}
    env:
      FIDEORA_DEVICE: ${{ matrix.device }}
      MAESTRO_CLI_NO_ANALYTICS: "true"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build unchanged application for Simulator
        run: |
          mkdir -p qa/store
          ios/App/ci_scripts/ci_post_clone.sh
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath /tmp/fideora-store -onlyUsePackageVersionsFromResolvedFile > qa/store/resolve.log 2>&1
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/fideora-store -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build > qa/store/build.log 2>&1
      - name: Install official Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Start store-sized simulator
        env:
          FIDEORA_DEVICE: ${{ matrix.device }}
        run: |
          xcrun simctl list -j > qa/store/simulators.json
          python3 - <<'PY'
          import json, os, subprocess
          data = json.load(open('qa/store/simulators.json'))
          presets = [v for items in data['devices'].values() for v in items if v['isAvailable'] and 'iPad Pro 13' in v['name']]
          model = 'iPhone 16 Pro' if os.environ['FIDEORA_DEVICE'] == 'iphone' else 'iPad Pro 13-inch (M4)'
          kind = next(t['identifier'] for t in data['devicetypes'] if t['name'] == model)
          runtime = next(r['identifier'] for r in reversed(data['runtimes']) if r['isAvailable'] and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-'))
          udid = presets[0]['udid'] if os.environ['FIDEORA_DEVICE']=='ipad' and presets else subprocess.check_output(['xcrun','simctl','create','Fideora Store',kind,runtime], text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('FIDEORA_SIMULATOR='+udid+'\n')
          PY
      - name: Capture Italian and Portuguese current app
        run: |
          xcrun simctl boot "$FIDEORA_SIMULATOR"
          xcrun simctl bootstatus "$FIDEORA_SIMULATOR" -b
          open -a Simulator
          xcrun simctl status_bar "$FIDEORA_SIMULATOR" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          for FIDEORA_LOCALE in it pt; do
            xcrun simctl uninstall "$FIDEORA_SIMULATOR" com.fideora.app || true
            xcrun simctl install "$FIDEORA_SIMULATOR" /tmp/fideora-store/Build/Products/Debug-iphonesimulator/App.app
            export FIDEORA_LOCALE
            python3 - <<'PY'
          import os, json
          pt=os.environ['FIDEORA_LOCALE']=='pt'
          lang='pt' if pt else 'it'
          steps=['appId: com.fideora.app','---','- launchApp','- extendedWaitUntil:','    visible: Chiudi','    timeout: 120000']
          if pt: steps+=['- tapOn: '+json.dumps('Português')]
          steps+=['- tapOn: '+json.dumps('Fechar' if pt else 'Chiudi'),'- waitForAnimationToEnd','- takeScreenshot: '+json.dumps(lang+'-01-today')]
          for n, label in [('02-bible','Bíblia' if pt else 'Bibbia'),('03-prayer','Rezar' if pt else 'Prega'),('04-notebook','Caderno' if pt else 'Quaderno')]:
              steps+=['- tapOn: '+json.dumps(label),'- waitForAnimationToEnd','- takeScreenshot: '+json.dumps(lang+'-'+n)]
          if os.environ['FIDEORA_DEVICE']=='iphone':
              steps+=['- tapOn: '+json.dumps('Conhecer Premium' if pt else 'Scopri Premium'),'- waitForAnimationToEnd','- takeScreenshot: '+json.dumps(lang+'-05-premium')]
              steps+=['- tapOn: '+json.dumps('Ver planos' if pt else 'Vedi i piani'),'- waitForAnimationToEnd','- takeScreenshot: '+json.dumps(lang+'-06-plans')]
          open('/tmp/fideora-store-flow.yaml','w').write('\n'.join(steps)+'\n')
          PY
            maestro --device "$FIDEORA_SIMULATOR" test --test-output-dir qa/store/maestro --debug-output qa/store/maestro /tmp/fideora-store-flow.yaml
          done
      - name: Validate actual screenshot dimensions
        run: |
          python3 - <<'PY'
          import glob, struct, shutil, os
          from pathlib import Path
          for source in Path('qa/store/maestro').rglob('*.png'):
              if source.name.startswith(('it-','pt-')):
                  shutil.copy2(source, Path('qa/store') / source.name)
          files=glob.glob('qa/store/*.png')
          assert len(files)==(12 if os.environ['FIDEORA_DEVICE']=='iphone' else 8), files
          for name in files:
              data=open(name,'rb').read(24)
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              size=struct.unpack('>II',data[16:24])
              assert size in [(1206,2622),(2064,2752)], (name,size)
              print(name,size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fideora-appstore-${{ matrix.device }}
          path: qa/store/
          include-hidden-files: true
