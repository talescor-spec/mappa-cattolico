name: Security & Build Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Audit high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fideora-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
