name: Security & Build Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve dependencies
        run: npm install

      - name: Apply deterministic auth UI patch
        run: node scripts/apply-auth-ui-patch.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: App Store preflight
        run: npm run appstore:preflight

      - name: Build
        run: npm run build

      - name: Persist validated generated files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json src/App.jsx src/styles.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json src/App.jsx src/styles.css
            git commit -m "feat: wire Fideora account UI and lock Supabase dependency"
            git push origin HEAD:${{ github.head_ref }}
          fi
