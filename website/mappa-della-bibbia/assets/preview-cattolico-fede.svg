<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Quattro pilastri, un unico cammino"><rect width="1280" height="960" fill="#f8f4eb"/><rect x="28" y="28" width="1224" height="904" fill="none" stroke="#c6af7d"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="18" fill="#18392f">F I D E O R A</text><text x="872" y="78" font-family="Arial,sans-serif" font-size="15" fill="#8b7040">LA MAPPA DEL CATTOLICO</text><path d="M70 102H1210" stroke="#c6af7d"/><text x="70" y="174" font-family="Georgia,serif" font-size="53" fill="#18392f">Quattro pilastri, un unico cammino</text><text x="70" y="223" font-family="Arial,sans-serif" font-size="25" fill="#7b795f">Una mappa per collegare ciò che credi, celebri, vivi e preghi.</text><text x="70" y="895" font-family="Arial,sans-serif" font-size="15" fill="#8b7040">TAVOLA EDITORIALE DIMOSTRATIVA · SPIEGAZIONI ORIGINALI</text><rect x="70" y="280" width="545" height="245" rx="8" fill="#ece6d8"/><text x="98" y="322" font-family="Arial,sans-serif" font-size="17" fill="#8b7040">CREDERE</text><text x="98" y="374" font-family="Georgia,serif" font-size="35" fill="#18392f">Il Credo</text><text x="98" y="415" font-family="Arial,sans-serif" font-size="23" fill="#586355">La professione di fede apre lo sguardo su</text><text x="98" y="447" font-family="Arial,sans-serif" font-size="23" fill="#586355">Dio Padre, su Gesù Cristo e sullo Spirito</text><text x="98" y="479" font-family="Arial,sans-serif" font-size="23" fill="#586355">Santo.</text><rect x="665" y="280" width="545" height="245" rx="8" fill="#ece6d8"/><text x="693" y="322" font-family="Arial,sans-serif" font-size="17" fill="#8b7040">CELEBRARE</text><text x="693" y="374" font-family="Georgia,serif" font-size="35" fill="#18392f">I sacramenti</text><text x="693" y="415" font-family="Arial,sans-serif" font-size="23" fill="#586355">La vita della Chiesa si esprime nella</text><text x="693" y="447" font-family="Arial,sans-serif" font-size="23" fill="#586355">liturgia e nei sette sacramenti.</text><rect x="70" y="560" width="545" height="245" rx="8" fill="#ece6d8"/><text x="98" y="602" font-family="Arial,sans-serif" font-size="17" fill="#8b7040">VIVERE</text><text x="98" y="654" font-family="Georgia,serif" font-size="35" fill="#18392f">La vita cristiana</text><text x="98" y="695" font-family="Arial,sans-serif" font-size="23" fill="#586355">Le Beatitudini, i comandamenti e le virtù</text><text x="98" y="727" font-family="Arial,sans-serif" font-size="23" fill="#586355">orientano le scelte di ogni giorno.</text><rect x="665" y="560" width="545" height="245" rx="8" fill="#ece6d8"/><text x="693" y="602" font-family="Arial,sans-serif" font-size="17" fill="#8b7040">PREGARE</text><text x="693" y="654" font-family="Georgia,serif" font-size="35" fill="#18392f">La preghiera</text><text x="693" y="695" font-family="Arial,sans-serif" font-size="23" fill="#586355">Il dialogo con Dio accompagna la vita; il</text><text x="693" y="727" font-family="Arial,sans-serif" font-size="23" fill="#586355">Padre nostro ne offre un riferimento</text><text x="693" y="759" font-family="Arial,sans-serif" font-size="23" fill="#586355">centrale.</text><text x="70" y="850" font-family="Arial,sans-serif" font-size="19" fill="#8b7040">Riferimento: le quattro parti del Catechismo della Chiesa Cattolica.</text></svg>