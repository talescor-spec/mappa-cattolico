<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="Pagina campione: il Vangelo secondo Luca"><rect width="720" height="960" fill="#fbf7ed"/><rect x="26" y="26" width="668" height="908" fill="none" stroke="#c5ad7c"/><path d="M49 65H671 M49 895H671" stroke="#b79b65" fill="none"/><text x="50" y="52" font-family="Georgia,serif" font-size="12" fill="#18392f">F I D E O R A</text><text x="480" y="52" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">LA MAPPA DEI LIBRI</text><text x="50" y="920" font-family="Arial,sans-serif" font-size="9" fill="#97866a">EDIZIONE STUDIO CATTOLICA · PAGINA CAMPIONE</text><text x="650" y="920" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">01</text><text x="55" y="113" font-family="Arial,sans-serif" font-size="11" fill="#9c7c43">IL VANGELO SECONDO</text><text x="52" y="174" font-family="Georgia,serif" font-size="62" fill="#18392f">Luca</text><text x="55" y="214" font-family="Georgia,serif" font-size="23" fill="#67704f" font-style="italic">Un viaggio che continua negli Atti.</text><text x="55" y="260" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">Il racconto di Gesù e la storia della prima comunità si</text><text x="55" y="287" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">incontrano in un percorso che continua negli Atti degli</text><text x="55" y="314" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">Apostoli. Leggi ogni episodio nel movimento dell’intera</text><text x="55" y="341" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">narrazione.</text><rect x="55" y="353" width="610" height="170" rx="2" fill="#eee7d7"/><text x="78" y="389" font-family="Arial,sans-serif" font-size="11" fill="#8e7547">IL FILO DEL RACCONTO</text><path d="M90 436H625" stroke="#b19560" stroke-width="2"/><circle cx="95" cy="436" r="6" fill="#ad8b50"/><text x="95" y="468" text-anchor="start" font-family="Georgia,serif" font-size="17" fill="#18392f">Gli inizi</text><text x="95" y="491" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#756c57">Lc 1–2</text><circle cx="270" cy="436" r="6" fill="#ad8b50"/><text x="270" y="468" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#18392f">Il ministero</text><text x="270" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#756c57">Lc 3–9</text><circle cx="445" cy="436" r="6" fill="#ad8b50"/><text x="445" y="468" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#18392f">Il cammino</text><text x="445" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#756c57">Lc 9–19</text><circle cx="620" cy="436" r="6" fill="#ad8b50"/><text x="620" y="468" text-anchor="end" font-family="Georgia,serif" font-size="17" fill="#18392f">Gerusalemme</text><text x="620" y="491" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#756c57">Lc 19–24</text><text x="55" y="568" font-family="Georgia,serif" font-size="29" fill="#18392f">Tre fili da seguire</text><text x="55" y="611" font-family="Georgia,serif" font-size="19" fill="#18392f">La misericordia</text><text x="55" y="638" font-family="Arial,sans-serif" font-size="15" fill="#4b564a">Osserva gli incontri, le parabole e le risposte di Gesù.</text><text x="55" y="679" font-family="Georgia,serif" font-size="19" fill="#18392f">Il cammino</text><text x="55" y="706" font-family="Arial,sans-serif" font-size="15" fill="#4b564a">Nota come luoghi e spostamenti danno forma al racconto.</text><text x="55" y="747" font-family="Georgia,serif" font-size="19" fill="#18392f">La preghiera</text><text x="55" y="774" font-family="Arial,sans-serif" font-size="15" fill="#4b564a">Fermati sui momenti in cui Gesù e i discepoli pregano.</text><text x="55" y="831" font-family="Arial,sans-serif" font-size="13" fill="#8e7547">Per collegare: Lc 1,1–4 · Lc 24,13–35 · At 1,1–3</text><text x="55" y="858" font-family="Arial,sans-serif" font-size="11" fill="#8b8576">Commento editoriale originale. Il testo completo è in preparazione.</text></svg>