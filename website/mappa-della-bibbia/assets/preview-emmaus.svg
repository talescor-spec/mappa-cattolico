<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="Pagina campione: il cammino di Emmaus"><rect width="720" height="960" fill="#fbf7ed"/><rect x="26" y="26" width="668" height="908" fill="none" stroke="#c5ad7c"/><path d="M49 65H671 M49 895H671" stroke="#b79b65" fill="none"/><text x="50" y="52" font-family="Georgia,serif" font-size="12" fill="#18392f">F I D E O R A</text><text x="480" y="52" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">LETTURA GUIDATA</text><text x="50" y="920" font-family="Arial,sans-serif" font-size="9" fill="#97866a">EDIZIONE STUDIO CATTOLICA · PAGINA CAMPIONE</text><text x="650" y="920" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">02</text><text x="55" y="113" font-family="Arial,sans-serif" font-size="11" fill="#9c7c43">LUCA 24,13–35</text><text x="52" y="172" font-family="Georgia,serif" font-size="43" fill="#18392f">Il cammino di Emmaus</text><text x="55" y="213" font-family="Georgia,serif" font-size="23" fill="#67704f" font-style="italic">Dal racconto alle tue domande.</text><text x="55" y="257" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">Due discepoli camminano e raccontano ciò che è accaduto. Gesù</text><text x="55" y="284" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">si avvicina, ascolta e accompagna la loro lettura delle</text><text x="55" y="311" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">Scritture. Il racconto invita a seguire il passaggio dalla</text><text x="55" y="338" font-family="Arial,sans-serif" font-size="17" fill="#4b564a">delusione al riconoscimento.</text><path d="M55 367H665" stroke="#d2c3a5"/><text x="55" y="390" font-family="Arial,sans-serif" font-size="12" fill="#a1844e">01</text><text x="97" y="390" font-family="Georgia,serif" font-size="23" fill="#18392f">Il contesto</text><text x="97" y="420" font-family="Arial,sans-serif" font-size="16" fill="#4b564a">Leggi la scena insieme agli altri episodi della</text><text x="97" y="445" font-family="Arial,sans-serif" font-size="16" fill="#4b564a">risurrezione in Luca 24.</text><path d="M55 470H665" stroke="#d2c3a5"/><text x="55" y="493" font-family="Arial,sans-serif" font-size="12" fill="#a1844e">02</text><text x="97" y="493" font-family="Georgia,serif" font-size="23" fill="#18392f">I movimenti della pagina</text><text x="97" y="523" font-family="Arial,sans-serif" font-size="16" fill="#4b564a">Nota il cammino, il dialogo, l’ascolto delle Scritture</text><text x="97" y="548" font-family="Arial,sans-serif" font-size="16" fill="#4b564a">e il gesto della mensa.</text><path d="M55 573H665" stroke="#d2c3a5"/><text x="55" y="596" font-family="Arial,sans-serif" font-size="12" fill="#a1844e">03</text><text x="97" y="596" font-family="Georgia,serif" font-size="23" fill="#18392f">Un dettaglio da osservare</text><text x="97" y="626" font-family="Arial,sans-serif" font-size="16" fill="#4b564a">Confronta ciò che i discepoli comprendono durante il</text><text x="97" y="651" font-family="Arial,sans-serif" font-size="16" fill="#4b564a">cammino con ciò che riconoscono dopo.</text><rect x="55" y="713" width="610" height="112" fill="#18392f"/><text x="77" y="748" font-family="Arial,sans-serif" font-size="10" fill="#d1ba87">FERMATI E RIFLETTI</text><text x="77" y="783" font-family="Georgia,serif" font-size="21" fill="#f8f4eb" font-style="italic">Quale domanda porteresti in quel cammino?</text><text x="55" y="859" font-family="Arial,sans-serif" font-size="11" fill="#8b8576">Riferimento: Lc 24,13–35 · Spiegazione editoriale, distinta dalla Scrittura.</text></svg>