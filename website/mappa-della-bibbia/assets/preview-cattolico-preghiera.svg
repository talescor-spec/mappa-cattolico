<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Dalla comprensione alla preghiera"><rect width="1280" height="960" fill="#f8f4eb"/><rect x="28" y="28" width="1224" height="904" fill="none" stroke="#c6af7d"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="18" fill="#18392f">F I D E O R A</text><text x="872" y="78" font-family="Arial,sans-serif" font-size="15" fill="#8b7040">LA MAPPA DEL CATTOLICO</text><path d="M70 102H1210" stroke="#c6af7d"/><text x="70" y="174" font-family="Georgia,serif" font-size="53" fill="#18392f">Dalla comprensione alla preghiera</text><text x="70" y="223" font-family="Arial,sans-serif" font-size="25" fill="#7b795f">Un piccolo spazio da abitare ogni giorno, con continuità.</text><text x="70" y="895" font-family="Arial,sans-serif" font-size="15" fill="#8b7040">TAVOLA EDITORIALE DIMOSTRATIVA · SPIEGAZIONI ORIGINALI</text><path d="M70 265H1210" stroke="#c6af7d"/><text x="75" y="320" font-family="Georgia,serif" font-size="39" fill="#18392f">Leggi</text><text x="570" y="308" font-family="Arial,sans-serif" font-size="24" fill="#586355">Scegli un breve brano del Vangelo. Osserva il</text><text x="570" y="344" font-family="Arial,sans-serif" font-size="24" fill="#586355">contesto e rileggi con calma.</text><path d="M70 435H1210" stroke="#c6af7d"/><text x="75" y="490" font-family="Georgia,serif" font-size="39" fill="#18392f">Fermati</text><text x="570" y="478" font-family="Arial,sans-serif" font-size="24" fill="#586355">Quale parola o domanda ti accompagna oggi?</text><text x="570" y="514" font-family="Arial,sans-serif" font-size="24" fill="#586355">Annota ciò che desideri comprendere.</text><path d="M70 605H1210" stroke="#c6af7d"/><text x="75" y="660" font-family="Georgia,serif" font-size="39" fill="#18392f">Prega e porta nella vita</text><text x="570" y="648" font-family="Arial,sans-serif" font-size="24" fill="#586355">Rivolgiti a Dio con parole semplici. Scegli un</text><text x="570" y="684" font-family="Arial,sans-serif" font-size="24" fill="#586355">piccolo gesto concreto per la giornata.</text><rect x="70" y="785" width="1140" height="65" fill="#18392f"/><text x="105" y="826" font-family="Georgia,serif" font-size="27" fill="#f8f4eb">La costanza si costruisce un passo alla volta.</text></svg>