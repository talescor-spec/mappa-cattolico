<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Il filo della Messa"><rect width="1280" height="960" fill="#f8f4eb"/><rect x="28" y="28" width="1224" height="904" fill="none" stroke="#c6af7d"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="18" fill="#18392f">F I D E O R A</text><text x="872" y="78" font-family="Arial,sans-serif" font-size="15" fill="#8b7040">LA MAPPA DEL CATTOLICO</text><path d="M70 102H1210" stroke="#c6af7d"/><text x="70" y="174" font-family="Georgia,serif" font-size="53" fill="#18392f">Il filo della Messa</text><text x="70" y="223" font-family="Arial,sans-serif" font-size="25" fill="#7b795f">Parola ed Eucaristia, unite in un solo atto di culto.</text><text x="70" y="895" font-family="Arial,sans-serif" font-size="15" fill="#8b7040">TAVOLA EDITORIALE DIMOSTRATIVA · SPIEGAZIONI ORIGINALI</text><rect x="70" y="278" width="1140" height="120" rx="5" fill="#ece6d8"/><text x="100" y="324" font-family="Georgia,serif" font-size="32" fill="#18392f">Riti di introduzione</text><text x="100" y="359" font-family="Arial,sans-serif" font-size="19" fill="#8b7040">Radunarsi e prepararsi</text><text x="590" y="323" font-family="Arial,sans-serif" font-size="22" fill="#586355">Il saluto, l’atto penitenziale e l’orazione</text><text x="590" y="354" font-family="Arial,sans-serif" font-size="22" fill="#586355">introducono la celebrazione.</text><rect x="70" y="418" width="1140" height="120" rx="5" fill="#ece6d8"/><text x="100" y="464" font-family="Georgia,serif" font-size="32" fill="#18392f">Liturgia della Parola</text><text x="100" y="499" font-family="Arial,sans-serif" font-size="19" fill="#8b7040">Ascoltare e rispondere</text><text x="590" y="463" font-family="Arial,sans-serif" font-size="22" fill="#586355">Letture, Vangelo, omelia e preghiera dei fedeli</text><text x="590" y="494" font-family="Arial,sans-serif" font-size="22" fill="#586355">accompagnano l’ascolto.</text><rect x="70" y="558" width="1140" height="120" rx="5" fill="#18392f"/><text x="100" y="604" font-family="Georgia,serif" font-size="32" fill="#f8f4eb">Liturgia eucaristica</text><text x="100" y="639" font-family="Arial,sans-serif" font-size="19" fill="#cfb57d">Offrire, rendere grazie, ricevere</text><text x="590" y="603" font-family="Arial,sans-serif" font-size="22" fill="#f0e9dc">Dalla preparazione dei doni alla Preghiera</text><text x="590" y="634" font-family="Arial,sans-serif" font-size="22" fill="#f0e9dc">eucaristica e alla Comunione.</text><rect x="70" y="698" width="1140" height="120" rx="5" fill="#ece6d8"/><text x="100" y="744" font-family="Georgia,serif" font-size="32" fill="#18392f">Riti di conclusione</text><text x="100" y="779" font-family="Arial,sans-serif" font-size="19" fill="#8b7040">Portare il cammino nella vita</text><text x="590" y="743" font-family="Arial,sans-serif" font-size="22" fill="#586355">La benedizione e il congedo aprono alla</text><text x="590" y="774" font-family="Arial,sans-serif" font-size="22" fill="#586355">testimonianza quotidiana.</text><text x="70" y="850" font-family="Arial,sans-serif" font-size="18" fill="#8b7040">Riferimento: Ordinamento Generale del Messale Romano, nn. 28 e 46–90.</text></svg>