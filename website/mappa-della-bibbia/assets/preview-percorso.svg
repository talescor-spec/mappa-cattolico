<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="Pagina campione: quaderno di lettura personale"><rect width="720" height="960" fill="#fbf7ed"/><rect x="26" y="26" width="668" height="908" fill="none" stroke="#c5ad7c"/><path d="M49 65H671 M49 895H671" stroke="#b79b65" fill="none"/><text x="50" y="52" font-family="Georgia,serif" font-size="12" fill="#18392f">F I D E O R A</text><text x="480" y="52" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">IL TUO PERCORSO</text><text x="50" y="920" font-family="Arial,sans-serif" font-size="9" fill="#97866a">EDIZIONE STUDIO CATTOLICA · PAGINA CAMPIONE</text><text x="650" y="920" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">03</text><text x="55" y="113" font-family="Arial,sans-serif" font-size="11" fill="#9c7c43">UNA PAGINA ALLA VOLTA</text><text x="52" y="174" font-family="Georgia,serif" font-size="43" fill="#18392f">Leggi. Fermati. Annota.</text><text x="55" y="216" font-family="Georgia,serif" font-size="23" fill="#67704f" font-style="italic">Uno spazio per ciò che scopri.</text><rect x="55" y="256" width="610" height="92" fill="#eee7d7"/><text x="78" y="287" font-family="Arial,sans-serif" font-size="10" fill="#8e7547">OGGI LEGGO</text><text x="78" y="321" font-family="Georgia,serif" font-size="23" fill="#18392f">Luca 24,13–35 · Il cammino di Emmaus</text><text x="55" y="398" font-family="Georgia,serif" font-size="21" fill="#ad8b50" font-style="italic">I</text><text x="91" y="398" font-family="Georgia,serif" font-size="24" fill="#18392f">Che cosa racconta la pagina?</text><text x="91" y="428" font-family="Arial,sans-serif" font-size="14" fill="#4b564a">Scrivi con parole tue ciò che accade nel testo.</text><path d="M91 464H665" stroke="#d2c3a5"/><path d="M91 492H665" stroke="#d2c3a5"/><text x="55" y="538" font-family="Georgia,serif" font-size="21" fill="#ad8b50" font-style="italic">II</text><text x="91" y="538" font-family="Georgia,serif" font-size="24" fill="#18392f">Quale domanda mi lascia?</text><text x="91" y="568" font-family="Arial,sans-serif" font-size="14" fill="#4b564a">Scegli un dettaglio o una frase da rileggere con calma.</text><path d="M91 604H665" stroke="#d2c3a5"/><path d="M91 632H665" stroke="#d2c3a5"/><text x="55" y="678" font-family="Georgia,serif" font-size="21" fill="#ad8b50" font-style="italic">III</text><text x="91" y="678" font-family="Georgia,serif" font-size="24" fill="#18392f">Quale piccolo passo posso fare?</text><text x="91" y="708" font-family="Arial,sans-serif" font-size="14" fill="#4b564a">Trasforma la riflessione in un proposito concreto.</text><path d="M91 744H665" stroke="#d2c3a5"/><path d="M91 772H665" stroke="#d2c3a5"/><text x="55" y="848" font-family="Georgia,serif" font-size="16" fill="#67704f" font-style="italic">La lettura continua: Lc 24,36–49.</text><text x="55" y="872" font-family="Arial,sans-serif" font-size="11" fill="#8b8576">Pagina di lavoro originale · Esempio del percorso personale.</text></svg>